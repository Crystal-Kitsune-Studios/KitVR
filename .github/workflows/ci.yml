name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - run: cargo build --workspace
      - run: cargo test --workspace

  vklayer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Vulkan headers and CMake
        run: sudo apt-get update && sudo apt-get install -y cmake libvulkan-dev
      - name: Build the Vulkan layer
        run: |
          cmake -S linux/vklayer -B linux/vklayer/build -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/vklayer/build
          cmake --install linux/vklayer/build --prefix linux/vklayer/package
      - name: Package the layer with its installer
        run: |
          mkdir -p layer-package/kitvr-layer
          cp -r linux/vklayer/package/kitvr/. layer-package/kitvr-layer/
          cp linux/install.sh linux/vrcompositor-wrapper.sh linux/README.md layer-package/kitvr-layer/
          tar -C layer-package -czf KitVR-vklayer-linux-x86_64.tar.gz kitvr-layer
      - name: Upload the layer
        uses: actions/upload-artifact@v4
        with:
          name: kitvr-desktop-linux-vklayer
          path: KitVR-vklayer-linux-x86_64.tar.gz
          if-no-files-found: error

    flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: KitVR-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/com.crystalkitsune.KitVR.yaml
          cache-key: flatpak-${{ github.sha }}
          artifact-name: kitvr-desktop-linux-flatpak
          
  quest-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: quest
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kitvr-quest-debug
          path: quest/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev librsvg2-bin; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Ubuntu package installation failed; retrying (attempt $((attempt + 1)) of 3)"
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Build desktop app and server
        env:
          KITVR_DESKTOP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --release --locked -p kitvr-desktop -p kitvr-server

      - name: Build and install SteamVR driver
        run: |
          cmake -S steamvr -B steamvr/build -DCMAKE_BUILD_TYPE=Release
          cmake --build steamvr/build --config Release
          cmake --install steamvr/build --prefix steamvr/package

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/kitvr-desktop.exe package/
          Copy-Item target/release/kitvr-server.exe package/
          Copy-Item target/release/kitvr-updater.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath KitVR-windows-x86_64.zip
          Compress-Archive -Path steamvr/package/kitvr -DestinationPath KitVR-steamvr-driver-windows-x86_64.zip

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/doc/kitvr
          cp target/release/kitvr-desktop target/release/kitvr-server target/release/kitvr-updater AppDir/usr/bin/
          cp README.md AppDir/usr/share/doc/kitvr/
          cp packaging/kitvr.desktop AppDir/usr/share/applications/
          rsvg-convert -w 256 -h 256 packaging/kitvr.svg -o AppDir/usr/share/icons/hicolor/256x256/apps/kitvr.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appimage-extract-and-run --appdir AppDir --desktop-file AppDir/usr/share/applications/kitvr.desktop --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/kitvr.png --executable AppDir/usr/bin/kitvr-desktop --executable AppDir/usr/bin/kitvr-server --executable AppDir/usr/bin/kitvr-updater --output appimage
          mv KitVR-x86_64.AppImage KitVR-linux-x86_64.AppImage
          tar -C steamvr/package -czf KitVR-steamvr-driver-linux-x86_64.tar.gz kitvr

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: kitvr-desktop-${{ matrix.platform }}
          path: |
            KitVR-${{ matrix.platform }}.*
            KitVR-steamvr-driver-${{ matrix.platform }}.*
          if-no-files-found: error

  release-apk:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-package, vklayer, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Add ANDROID_KEYSTORE_BASE64 to repository Actions secrets}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kitvr-release.keystore"

      - name: Build signed release APK
        working-directory: quest
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kitvr-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_PASSWORD:?Add ANDROID_KEYSTORE_PASSWORD to repository Actions secrets}"
          : "${ANDROID_KEY_ALIAS:?Add ANDROID_KEY_ALIAS to repository Actions secrets}"
          : "${ANDROID_KEY_PASSWORD:?Add ANDROID_KEY_PASSWORD to repository Actions secrets}"
          gradle assembleRelease --stacktrace

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: kitvr-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish packages on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KitVR ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            quest/app/build/outputs/apk/release/app-release.apk
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.tar.gz
            release-assets/*.flatpak