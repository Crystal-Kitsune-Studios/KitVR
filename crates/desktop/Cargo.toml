[package]
name = "kitvr-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
# kitvr-mascot: VRM (glTF binary) loading and pose math.
glam = "0.29"
kitvr-proto = { path = "../proto" }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "KHR_materials_unlit", "KHR_texture_transform"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
webbrowser = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Global cursor and work area for kitvr-mascot; loaded at runtime like eframe's own X11 backend.
x11-dl = "2.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
